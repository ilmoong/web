<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 💖</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url('images.jpg') center/cover no-repeat fixed;
  color:white;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:80px;
  min-height:100vh;
  overflow:auto;
}

.container{
  width:95%;
  max-width:420px;
  text-align:center;
  position:relative;
}

/* ===== MUSIC BUTTON ===== */
.music-btn{
  position:fixed;
  top:15px;
  right:15px;
  width:52px;
  height:52px;
  border-radius:50%;
  border:none;
  background:url('Spotify light pink app icons for iPhone 2024.jpg') center/cover no-repeat;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,0.3);
}

/* ===== PAGE ===== */
.page{
  position:absolute;
  width:100%;
  top:0;
  left:0;
  opacity:0;
  transform:scale(0.9);
  pointer-events:none;
}

.page.active{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
  animation:popup 0.35s ease;
}

@keyframes popup{
  0%{opacity:0; transform:scale(0.7);}
  60%{opacity:1; transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* ===== OPENING LETTER ===== */
.letter-wrapper{
  display:flex;
  justify-content:center;
  margin-top:60px;
}

.envelope{
  width:260px;
  height:180px;
  background:#f2a7c1;
  position:relative;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,0.35);
  overflow:hidden;
}

.envelope-body{
  position:absolute;
  inset:0;
  background:#f2a7c1;
}

.envelope-top{
  position:absolute;
  width:100%;
  height:100%;
  background:#f6bfd4;
  clip-path:polygon(0 0,100% 0,50% 55%);
  transform-origin:top;
  transition:transform 0.8s ease;
}

.envelope.open .envelope-top{
  transform:rotateX(180deg);
}

.letter-text{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
}

.letter-text h3{margin:0;font-size:22px;}
.letter-text p{margin-top:6px;font-size:14px;}

/* ===== GAME ===== */
.card-box{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:20px;
  perspective:800px;
}

.card{
  height:70px;
  border-radius:12px;
  cursor:pointer;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.45s;
}

.card-face{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  backface-visibility:hidden;
}

.card-front{background:#6c6f9c;}
.card-back{background:#f2a7c1;transform:rotateY(180deg);}
.card.flipped{transform:rotateY(180deg);}

/* ===== BUTTON ===== */
button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  font-size:16px;
  margin-top:18px;
  cursor:pointer;
}

/* ===== CAKE ===== */
#cake{font-size:80px;margin:20px 0;}

/* ===== VIDEO ===== */
video{
  width:100%;
  margin-top:15px;
  border-radius:12px;
}

/* ===== TYPING ===== */
.typing{
  white-space:pre-line;
  text-align:left;
  line-height:1.6;
  margin-top:10px;
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="ssstik.io_@nogika_chaba_1770562410533.mp4" type="audio/mp4">
</audio>

<button class="music-btn" onclick="toggleMusic()"></button>

<div class="container">

<!-- OPEN LETTER -->
<div id="letterPage" class="page active">
  <div class="letter-wrapper">
    <div class="envelope" onclick="openLetter()">
      <div class="envelope-top"></div>
      <div class="envelope-body"></div>
      <div class="letter-text">
        <h3>For You 💌</h3>
        <p>Klik amplopnya</p>
      </div>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="gamePage" class="page">
  <h2>A Little Game 🎁</h2>
  <p>Balik 2 kartu yang sama</p>
  <div class="card-box" id="board"></div>
</div>

<!-- CAKE -->
<div id="cakePage" class="page">
  <h2>Make a Wish 🎂</h2>
  <div id="cake">🎂🔥</div>
  <button onclick="blowCandle()">Tiup Lilin</button>
</div>

<!-- MESSAGE -->
<div id="msgPage" class="page">
  <h2>Happy Birthday 🥳</h2>
  <div id="typedText" class="typing"></div>
  <button onclick="showPage('galleryPage')">Buka Gallery 📸</button>
</div>

<!-- GALLERY -->
<div id="galleryPage" class="page">
  <h2>Gallery Memories 🎬</h2>

  <video controls>
    <source src="d53857f39bad42c8abb7c0aed4613977.mp4" type="video/mp4">
  </video>
  <p>Momen pertama kita 💖</p>

  <video controls>
    <source src="VID-20250414-WA0130.mp4" type="video/mp4">
  </video>
  <p>Duo evos 😭</p>

  <button onclick="showPage('msgPage')">⬅ Kembali</button>
</div>

</div>

<script>
/* MUSIC */
const bgMusic=document.getElementById('bgMusic');
let musicPlaying=false;
function toggleMusic(){
  if(!musicPlaying){bgMusic.volume=0.4;bgMusic.play();musicPlaying=true;}
  else{bgMusic.pause();musicPlaying=false;}
}

/* OPEN LETTER */
function openLetter(){
  document.querySelector('.envelope').classList.add('open');
  setTimeout(()=>showPage('gamePage'),900);
}

/* PAGE */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const t=document.getElementById(id);
  void t.offsetWidth;
  t.classList.add('active');
  if(id==='msgPage') startTyping();
}

/* GAME */
const icons=['🎉','🎁','💖','🥳'];
let cards=[...icons,...icons].sort(()=>Math.random()-0.5);
const board=document.getElementById('board');
let first=null,second=null,lock=false,matched=0;

cards.forEach(icon=>{
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`<div class="card-face card-front"></div><div class="card-face card-back">${icon}</div>`;
  board.appendChild(card);

  card.onclick=()=>{
    if(lock||card===first||card.classList.contains('matched'))return;
    card.classList.add('flipped');
    if(!first){first=card;}
    else{
      second=card;lock=true;
      if(first.lastChild.textContent===second.lastChild.textContent){
        first.classList.add('matched');
        second.classList.add('matched');
        matched++;reset();
        if(matched===icons.length)setTimeout(()=>showPage('cakePage'),700);
      }else{
        setTimeout(()=>{first.classList.remove('flipped');second.classList.remove('flipped');reset();},800);
      }
    }
  }
});

function reset(){first=null;second=null;lock=false;}

/* CAKE */
function blowCandle(){
  document.getElementById('cake').textContent='🎂';
  setTimeout(()=>showPage('msgPage'),800);
}

/* TYPING */
const message=`Semoga kamu selalu sehat, bahagia, dan semua keinginanmu tercapai.

Aku selalu dukung kamu, kapan pun itu. 💖`;
let typed=false;
function startTyping(){
  if(typed)return;typed=true;
  const el=document.getElementById('typedText');el.textContent='';
  let i=0;function type(){if(i<message.length){el.textContent+=message[i++];setTimeout(type,25);}}type();
}
</script>

</body>
</html>
