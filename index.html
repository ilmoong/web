<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url('250326b34e114f477529983271b4f3cf.jpg') center/cover no-repeat fixed;
  color:white;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:80px;
  min-height:100vh;
  overflow:auto;
}

.container{
  width:95%;
  max-width:420px;
  text-align:center;
  position:relative;
}

/* MUSIC */
.music-btn{
  position:fixed;
  top:15px;
  right:15px;
  width:52px;
  height:52px;
  border-radius:50%;
  border:none;
  background:url('Spotify light pink app icons for iPhone 2024.jpg') center/cover no-repeat;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,0.3);
}

/* CARD */
.card-box{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:20px;
  perspective:800px;
}

.card{
  height:70px;
  border-radius:12px;
  cursor:pointer;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.45s;
}

.card-face{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  backface-visibility:hidden;
}

.card-front{ background:#6c6f9c; }
.card-back{ background:#f2a7c1; transform:rotateY(180deg); }
.card.flipped{ transform:rotateY(180deg); }

/* BUTTON */
button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  font-size:16px;
  margin-top:18px;
  cursor:pointer;
}

/* GIF CAKE */
#cakeGif{
  width:200px;
  margin-top:15px;
  border-radius:12px;
  transition:0.3s;
}

/* VIDEO */
video{
  width:100%;
  margin-top:15px;
  border-radius:12px;
}

/* PAGE */
.page{
  position:absolute;
  width:100%;
  top:0;
  left:0;
  opacity:0;
  transform:scale(0.9);
  pointer-events:none;
}

.page.active{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
  animation:popup 0.35s ease;
}

@keyframes popup{
  0%{opacity:0; transform:scale(0.7);}
  60%{opacity:1; transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* TYPING */
.typing{
  white-space:pre-line;
  text-align:left;
  line-height:1.6;
  margin-top:10px;
}

#candleGif, #cakeGif{
  width:200px;
  display:block;
  margin:20px auto;
  border-radius:12px;
}

#cakePage{
  text-align:center;
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="ssstik.io_@nogika_chaba_1770562410533.mp4" type="audio/mp4">
</audio>

<button class="music-btn" onclick="toggleMusic()"></button>

<div class="container">

<!-- GAME -->
<div id="gamePage" class="page active">
  <h2>Game kecil-kecilan hehe</h2>
  <p>Balik 2 kartu yang sama!</p>
  <div class="card-box" id="board"></div>
</div>

<!-- CAKE (UPDATED) -->
<div id="cakePage" class="page">
  <h2 id="cakeTitle">Make a Wish 🎉</h2>

  <!-- GIF LILIN -->
  <img id="candleGif" src="candle.gif">

  <!-- GIF CAKE (hidden dulu) -->
  <img id="cakeGif" src="cake-candle.gif" style="display:none;">

  <p id="cakeText">Buat permintaan lalu tiup lilinnya!</p>

  <!-- BUTTON -->
  <button id="blowBtn" onclick="blowCandle()">Tiup Lilin</button>
</div>

<!-- MESSAGE -->
<div id="msgPage" class="page">
  <h2>Happy Birthday 🥳</h2>
  <div id="typedText" class="typing"></div>
  <button onclick="showPage('galleryPage')">Buka Gallery 📸</button>
</div>

<!-- GALLERY -->
<div id="galleryPage" class="page">
  <h2>Gallery Memories 🎬</h2>
  <h4>matiin musiknya ya biar ga nabrak suaranyaa💖</h4>

  <video controls>
    <source src="d53857f39bad42c8abb7c0aed4613977.mp4">
  </video>

  <video controls>
    <source src="VID-20250414-WA0130.mp4">
  </video>

  <button onclick="showPage('msgPage')">⬅ Kembali</button>
</div>

</div>

<script>
/* MUSIC */
const bgMusic=document.getElementById('bgMusic');
let musicPlaying=false;

function toggleMusic(){
  if(!musicPlaying){
    bgMusic.volume=0.4;
    bgMusic.play();
    musicPlaying=true;
  }else{
    bgMusic.pause();
    musicPlaying=false;
  }
}

/* GAME */
const icons=['🎉','🎁','💖','🥳'];
let cards=[...icons,...icons].sort(()=>Math.random()-0.5);
const board=document.getElementById('board');

let first=null,second=null,lock=false,matched=0;

cards.forEach(icon=>{
  const card=document.createElement('div');
  card.className='card';

  const front=document.createElement('div');
  front.className='card-face card-front';

  const back=document.createElement('div');
  back.className='card-face card-back';
  back.textContent=icon;

  card.append(front,back);
  board.appendChild(card);

  card.onclick=()=>{
    if(lock||card===first||card.classList.contains('matched'))return;

    if(!musicPlaying){
      bgMusic.play();
      musicPlaying=true;
    }

    card.classList.add('flipped');

    if(!first){first=card;}
    else{
      second=card;
      lock=true;

      if(first.lastChild.textContent===second.lastChild.textContent){
        matched++;
        reset();

        if(matched===icons.length){
          setTimeout(()=>showPage('cakePage'),700);
        }
      }else{
        setTimeout(()=>{
          first.classList.remove('flipped');
          second.classList.remove('flipped');
          reset();
        },800);
      }
    }
  };
});

function reset(){first=null;second=null;lock=false;}

/* CAKE ANIMATION */
function blowCandle(){
  document.getElementById('candleGif').style.display = 'none';
  document.getElementById('cakeGif').style.display = 'block';
  document.getElementById('blowBtn').style.display = 'none';

  // 🔥 GANTI TEKS DI SINI
  document.getElementById('cakeTitle').style.display = 'none';
  document.getElementById('cakeText').textContent = "Yeay 🎉 selamat ulang tahun!!";

  const cake = document.getElementById('cakeGif');
  cake.style.transform = "scale(1.1)";
  setTimeout(()=>cake.style.transform="scale(1)",200);

  setTimeout(()=>showPage('msgPage'),4000);
}

/* PAGE */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  if(id==='msgPage') startTyping();
}

/* TYPING */
const message=`Semoga kamu selalu sehat, bahagia, dan semua keinginanmu tercapai tahun ini.

Aku selalu dukung kamu 💖`;

let typed=false;

function startTyping(){
  if(typed)return;
  typed=true;

  const el=document.getElementById('typedText');
  let i=0;

  function type(){
    if(i<message.length){
      el.textContent+=message[i++];
      setTimeout(type,25);
    }
  }
  type();
}
</script>

</body>
</html>
