<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url('images.jpg') center/cover no-repeat fixed;
  color:white;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:80px;
  min-height:100vh;
  overflow:auto;
}

.container{
  width:95%;
  max-width:420px;
  text-align:center;
  position:relative;
}

/* ===== MUSIC BUTTON ===== */
.music-btn{
  position:fixed;
  top:15px;
  right:15px;
  background:#ffffff22;
  color:white;
  border:none;
  border-radius:50%;
  width:48px;
  height:48px;
  font-size:20px;
  cursor:pointer;
}

/* ===== CARD GAME ===== */
.card-box{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:20px;
  perspective:800px;
}

.card{
  height:70px;
  border-radius:12px;
  cursor:pointer;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.45s;
}

.card:hover{transform:scale(1.05);}

.card-face{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  backface-visibility:hidden;
}

.card-front{ background:#6c6f9c; }
.card-back{ background:#f2a7c1; transform:rotateY(180deg); }

.card.flipped{ transform:rotateY(180deg); }

/* ===== BUTTON ===== */
button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  font-size:16px;
  margin-top:18px;
  cursor:pointer;
}

/* ===== CAKE ===== */
#cake{
  font-size:80px;
  margin:20px 0;
}

/* ===== VIDEO ===== */
video{
  width:100%;
  margin-top:15px;
  border-radius:12px;
}

/* ===== PAGE SYSTEM ===== */
.page{
  position:absolute;
  width:100%;
  top:0;
  left:0;
  opacity:0;
  transform:scale(0.9);
  pointer-events:none;
}

.page.active{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
  animation:popup 0.35s ease;
}

/* ===== POPUP ===== */
@keyframes popup{
  0%{opacity:0; transform:scale(0.7);}
  60%{opacity:1; transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* ===== TYPING TEXT ===== */
.typing{
  white-space:pre-line;
  text-align:left;
  line-height:1.6;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- BACKGROUND MUSIC -->
<audio id="bgMusic" loop>
  <source src="ssstik.io_@nogika_chaba_1770562410533.mp4" type="audio/mp4">
</audio>

<button class="music-btn" onclick="toggleMusic()">🎵</button>

<div class="container">

<!-- PAGE 1 GAME -->
<div id="gamePage" class="page active">
  <h2>A Little Game for You 🎁</h2>
  <p>Balik 2 kartu yang sama!</p>
  <div class="card-box" id="board"></div>
</div>

<!-- PAGE 2 CAKE -->
<div id="cakePage" class="page">
  <h2>Make a Wish 🎉</h2>
  <div id="cake">🎂🔥</div>
  <p>Buat permintaan lalu tiup lilinnya!</p>
  <button onclick="blowCandle()">Tiup Lilin</button>
</div>

<!-- PAGE 3 MESSAGE -->
<div id="msgPage" class="page">
  <h2>Happy Birthday 🥳</h2>
  <div id="typedText" class="typing"></div>
  <button onclick="showPage('galleryPage')">Buka Gallery 📸</button>
</div>

<!-- PAGE 4 GALLERY -->
<div id="galleryPage" class="page">
  <h2>Gallery Memories 🎬</h2>

  <video controls>
    <source src="d53857f39bad42c8abb7c0aed4613977.mp4" type="video/mp4">
  </video>
  <p>Momen pertama kita bikin video bareng 💖</p>

  <video controls>
    <source src="VID-20250414-WA0130.mp4" type="video/mp4">
  </video>
  <p>Duo evos 😭</p>

  <button onclick="showPage('msgPage')">⬅ Kembali</button>
</div>

</div>

<script>
/* ===== MUSIC ===== */
const bgMusic = document.getElementById('bgMusic');
let musicPlaying = false;

function toggleMusic(){
  if(!musicPlaying){
    bgMusic.volume = 0.4;
    bgMusic.play();
    musicPlaying = true;
  }else{
    bgMusic.pause();
    musicPlaying = false;
  }
}

/* ===== MEMORY GAME ===== */
const icons = ['🎉','🎁','💖','🥳'];
let cards = [...icons, ...icons].sort(() => Math.random() - 0.5);
const board = document.getElementById('board');

let first=null, second=null, lock=false, matched=0;

cards.forEach(icon=>{
  const card=document.createElement('div');
  card.className='card';

  const front=document.createElement('div');
  front.className='card-face card-front';

  const back=document.createElement('div');
  back.className='card-face card-back';
  back.textContent=icon;

  card.append(front,back);
  board.appendChild(card);

  card.onclick=()=>{
    if(!musicPlaying){
      bgMusic.volume=0.4;
      bgMusic.play();
      musicPlaying=true;
    }

    if(lock || card===first || card.classList.contains('matched')) return;
    card.classList.add('flipped');

    if(!first){
      first=card;
    }else{
      second=card;
      lock=true;

      if(first.lastChild.textContent===second.lastChild.textContent){
        first.classList.add('matched');
        second.classList.add('matched');
        matched++;
        reset();

        if(matched===icons.length){
          setTimeout(()=>showPage('cakePage'),700);
        }
      }else{
        setTimeout(()=>{
          first.classList.remove('flipped');
          second.classList.remove('flipped');
          reset();
        },800);
      }
    }
  };
});

function reset(){
  first=null; second=null; lock=false;
}

/* ===== PAGE SWITCH ===== */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const t=document.getElementById(id);
  void t.offsetWidth;
  t.classList.add('active');

  if(id==='msgPage') startTyping();
}

/* ===== CAKE ===== */
function blowCandle(){
  document.getElementById('cake').textContent='🎂';
  setTimeout(()=>showPage('msgPage'),800);
}

/* ===== TYPING EFFECT ===== */
const message=`Semoga kamu selalu sehat, bahagia, dan semua keinginanmu tercapai tahun ini.

Di usia yang baru ini, semoga kamu makin kuat, makin sabar, dan makin percaya sama diri sendiri.
Apa pun yang kamu impikan, pelan-pelan semoga satu per satu bisa terwujud dengan cara terbaik.

Semangat terus ya buat ngejar semua keinginan kamu.
Aku selalu dukung kamu dari sini. 💖`;

function startTyping(){
  const el=document.getElementById('typedText');
  el.textContent='';
  let i=0;

  function type(){
    if(i<message.length){
      el.textContent+=message[i];
      i++;
      setTimeout(type,25);
    }
  }
  type();
}
</script>

</body>
</html>
